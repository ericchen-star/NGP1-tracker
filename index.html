<script>
const SUPABASE_URL = "https://vtmrlkakcxhfahussrgu.supabase.co";
const SUPABASE_KEY = "sb_publishable_bC0awmT8nQTWqhjTpLgHxQ_HYRH2RJ9";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MONTHS = ["7月","8月","9月","10月","11月","12月"];
const BEUTII_STORES = ["Beutii-三創店","Beutii-新莊宏匯店","Beutii-信義統一店"];
const DREAM_STORE = "Dreame-信義統一店";
const ALL_STORES = [...BEUTII_STORES, DREAM_STORE];

const DEFAULT_TARGETS = {
  "Beutii-三創店": [397000,291000,386000,365000,328000,489000],
  "Beutii-新莊宏匯店": [356000,138000,302000,236000,380000,457000],
  "Beutii-信義統一店": [232000,255000,251000,310000,221000,231000],
  "Dreame-信義統一店": [121000,421000,289000,318000,176000,176000],
};

const DEFAULT_COMMISSION = {
  "Beutii-三創店": 0.08,
  "Beutii-新莊宏匯店": 0.09,
  "Beutii-信義統一店": 0.105,
};

const DEFAULT_OES1 = {
  "Beutii-三創店": 0.142,
  "Beutii-新莊宏匯店": 0.122,
  "Beutii-信義統一店": 0.127,
};

const DEFAULT_STRATEGY_NOTES = [
  { title: "提高品牌店 SR，掌握人流", text: "提高品牌店SR，維持小檔留單，大檔call客衝刺，並且找機會丟百貨鋪底到北部的社區群組裡。" },
  { title: "毛利結構目標", text: "提高毛利結構，三創店、統一店維持30%，宏匯店27%。" },
  { title: "專案機目標與考核", text: "設定專案機目標，每週檢核，設定獎勵、考核分數。" },
  { title: "呆滯品退倉與坪效", text: "呆滯商品退倉機制，更換其他潛力商品。改為追求坪效，陳列更換找出每間門市擅長的品項。" },
  { title: "低毛商品銷售優先序", text: "低毛商品優先為各店列出NGP1高的商品販售。不是刻意不賣，而是賣也要選擇最賺錢的。" },
  { title: "三創12月店內特賣會", text: "三創12月店內特賣會，提前一個月準備，選品嚴格守住毛利底線，提升業績。" },
];

function defaultState() {
  const products = {};
  const otherRevenue = {};
  BEUTII_STORES.forEach(s => {
    products[s] = [];
    otherRevenue[s] = {};
    MONTHS.forEach(m => { otherRevenue[s][m] = { gmv: null, gp: null }; });
  });
  const dreamGmv = {};
  MONTHS.forEach(m => { dreamGmv[m] = null; });
  return {
    targets: JSON.parse(JSON.stringify(DEFAULT_TARGETS)),
    commission: { ...DEFAULT_COMMISSION },
    oes1Rate: { ...DEFAULT_OES1 },
    cashFeeRate: 0.02,
    dreamRate: 0.03,
    products,
    otherRevenue,
    dreamGmv,
    strategyNotes: JSON.parse(JSON.stringify(DEFAULT_STRATEGY_NOTES)).map((n, i) => ({ id: "s" + i, ...n })),
  };
}

function mergeWithDefaults(parsed) {
  const base = defaultState();
  if (!parsed) return base;
  return { ...base, ...parsed,
    targets: { ...base.targets, ...(parsed.targets||{}) },
    commission: { ...base.commission, ...(parsed.commission||{}) },
    oes1Rate: { ...base.oes1Rate, ...(parsed.oes1Rate||{}) },
    products: { ...base.products, ...(parsed.products||{}) },
    otherRevenue: { ...base.otherRevenue, ...(parsed.otherRevenue||{}) },
    dreamGmv: { ...base.dreamGmv, ...(parsed.dreamGmv||{}) },
    strategyNotes: (parsed.strategyNotes && parsed.strategyNotes.length) ? parsed.strategyNotes : base.strategyNotes,
  };
}

let state = defaultState();

// ---------- 雲端同步 ----------
function setSyncStatus(kind, text) {
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncText");
  if (!dot || !label) return;
  dot.className = "sync-dot" + (kind ? " " + kind : "");
  label.textContent = text;
}

let saveTimer = null;

async function pushToCloud() {
  setSyncStatus("busy", "同步中…");
  const { error } = await sb.from("app_state").update({
    data: state,
    updated_at: new Date().toISOString(),
  }).eq("id", 1);
  if (error) {
    console.error("寫入雲端失敗", error);
    setSyncStatus("error", "同步失敗，請檢查網路後重新整理（" + error.message + "）");
  } else {
    const now = new Date();
    setSyncStatus("ok", "已同步　最後更新 " + now.toLocaleTimeString("zh-TW", { hour12: false }));
  }
}

// 立即存檔＋重繪：用在新增/刪除列、下拉選單、設定值變更等離散操作
function saveState() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  pushToCloud();
  renderAll();
}
// 打字過程中：先更新本地畫面，網路寫入延遲批次送出，避免每個字都打一次雲端
function saveStateQuiet() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { pushToCloud(); }, 600);
}

let pendingRemoteState = null;
function isCurrentlyEditing() {
  const el = document.activeElement;
  return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
}
function applyPendingRemoteIfIdle() {
  if (!isCurrentlyEditing() && pendingRemoteState) {
    state = mergeWithDefaults(pendingRemoteState);
    pendingRemoteState = null;
    renderAll();
  }
}
document.addEventListener("focusout", () => { setTimeout(applyPendingRemoteIfIdle, 0); });

async function initCloud() {
  setSyncStatus("busy", "連線中…");
  const { data, error } = await sb.from("app_state").select("data").eq("id", 1).single();
  if (error) {
    console.error("讀取雲端資料失敗", error);
    setSyncStatus("error", "讀取雲端資料失敗，暫時使用預設值（" + error.message + "）");
    renderAll();
    return;
  }
  state = mergeWithDefaults(data.data);
  setSyncStatus("ok", "已連上雲端資料庫");
  renderAll();

  sb.channel("app_state-sync")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "app_state", filter: "id=eq.1" }, (payload) => {
      const incoming = payload.new && payload.new.data;
      if (!incoming) return;
      if (isCurrentlyEditing()) {
        pendingRemoteState = incoming;
      } else {
        state = mergeWithDefaults(incoming);
        renderAll();
      }
    })
    .subscribe();
}

function uid() {
  return "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function fmtMoney(v) {
  if (v === null || v === undefined || isNaN(v)) return "$0";
  return "$" + Math.round(v).toLocaleString();
}
function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return (v * 100).toFixed(1) + "%";
}
function rateClass(v) {
  if (v === null || v === undefined || isNaN(v)) return "";
  return v >= 1 ? "rate-good" : v >= 0.8 ? "rate-warn" : "rate-bad";
}
function barColor(v) {
  if (v === null || v === undefined || isNaN(v)) return "#cccccc";
  return v >= 1 ? "#2f7d4f" : v >= 0.8 ? "#d4a017" : "#c0392b";
}

// ---------- 計算邏輯 ----------
// 活動價、活動價GP 是「每一件商品」的金額，只用來計算目標NGP1（跟目標數量連動）。
// 實際NGP1改用 SR（銷額）與 GP actual（實際GP）計算，跟活動價/活動價GP無關。
function unitNGP1(p, store) {
  const commission = state.commission[store] ?? 0;
  const fee = state.cashFeeRate ?? 0;
  const oes1 = state.oes1Rate[store] ?? 0;
  const unitGmv = Number(p.gmv) || 0;
  const unitGp = Number(p.gp) || 0;
  return unitGp - unitGmv * commission - unitGmv * fee - unitGmv * oes1;
}
// 實際NGP1：GP actual − SR×抽成率 − SR×金流費率 − SR×OES1固定費用
function productNGP1(p, store) {
  const commission = state.commission[store] ?? 0;
  const fee = state.cashFeeRate ?? 0;
  const oes1 = state.oes1Rate[store] ?? 0;
  const sr = Number(p.sr) || 0;
  const gpActual = Number(p.gpActual) || 0;
  return gpActual - sr * commission - sr * fee - sr * oes1;
}
// 目標NGP1：跟「目標數量」連動（用同一個單位淨利，不需要先有銷售數量）
function productTargetNGP1(p, store) {
  const targetQty = Number(p.targetQty) || 0;
  if (!targetQty) return null;
  return targetQty * unitNGP1(p, store);
}
function productGPPct(p) {
  const unitGmv = Number(p.gmv) || 0;
  const unitGp = Number(p.gp) || 0;
  if (!unitGmv) return null;
  return unitGp / unitGmv;
}

// 其他營收（一整包金額，不逐筆列商品）：直接填當月 GMV、GP 總額，換算NGP1的方式跟商品明細一致
function otherRevenueEntry(store, month) {
  const entry = (state.otherRevenue[store] || {})[month] || { gmv: null, gp: null };
  return entry;
}
function otherRevenueNGP1(store, month) {
  const commission = state.commission[store] ?? 0;
  const fee = state.cashFeeRate ?? 0;
  const oes1 = state.oes1Rate[store] ?? 0;
  const entry = otherRevenueEntry(store, month);
  const gmv = Number(entry.gmv) || 0;
  const gp = Number(entry.gp) || 0;
  return gp - gmv * commission - gmv * fee - gmv * oes1;
}

// 商品品項 -> 底下每個業務員各自的登錄列，攤平成一份清單方便加總
function allEntriesForStore(store) {
  const items = state.products[store] || [];
  const out = [];
  items.forEach(item => {
    (item.entries || []).forEach(e => out.push(e));
  });
  return out;
}

function beutiiMonthlySummary(store) {
  return MONTHS.map((month, i) => {
    const rows = allEntriesForStore(store).filter(p => p.month === month);
    const productQty = rows.reduce((s, p) => s + (Number(p.qty) || 0), 0);
    const productGmv = rows.reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.gmv) || 0), 0);
    const productGp = rows.reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.gp) || 0), 0);
    const productNgp1 = rows.reduce((s, p) => s + productNGP1(p, store), 0);

    const otherEntry = otherRevenueEntry(store, month);
    const otherGmv = Number(otherEntry.gmv) || 0;
    const otherGp = Number(otherEntry.gp) || 0;
    const otherNgp1 = otherRevenueNGP1(store, month);

    const qty = productQty; // 其他營收沒有數量概念
    const gmv = productGmv + otherGmv;
    const gp = productGp + otherGp;
    const ngp1 = productNgp1 + otherNgp1;
    const target = state.targets[store][i];
    const rate = target ? ngp1 / target : null;
    return { month, qty, gmv, gp, gpPct: gmv ? gp/gmv : null, ngp1, target, rate };
  });
}

function dreamMonthlySummary() {
  return MONTHS.map((month, i) => {
    const gmv = state.dreamGmv[month];
    const ngp1 = gmv ? gmv * state.dreamRate : 0;
    const target = state.targets[DREAM_STORE][i];
    const rate = target ? ngp1 / target : null;
    return { month, gmv, ngp1, target, rate };
  });
}

function storeCumulative(store) {
  if (store === DREAM_STORE) {
    const rows = dreamMonthlySummary();
    const target = rows.reduce((s, r) => s + (r.target || 0), 0);
    const actual = rows.reduce((s, r) => s + (r.ngp1 || 0), 0);
    return { store, target, actual, rate: target ? actual / target : null };
  }
  const rows = beutiiMonthlySummary(store);
  const target = rows.reduce((s, r) => s + (r.target || 0), 0);
  const actual = rows.reduce((s, r) => s + (r.ngp1 || 0), 0);
  return { store, target, actual, rate: target ? actual / target : null };
}

function allMonthlyRows() {
  const rows = [];
  BEUTII_STORES.forEach(store => {
    beutiiMonthlySummary(store).forEach(r => rows.push({ store, month: r.month, target: r.target, actual: r.ngp1, rate: r.rate }));
  });
  dreamMonthlySummary().forEach(r => rows.push({ store: DREAM_STORE, month: r.month, target: r.target, actual: r.ngp1, rate: r.rate }));
  return rows;
}

        input.addEventListener("input", (e) => {

        input.addEventListener("blur", () => {
          saveState();
        });
      });
      tr.querySelector('[data-action="del"]').onclick = () => {
        const item = (state.products[store] || []).find(x => x.id === itemId);
        if (!item) return;
        item.entries = (item.entries || []).filter(x => x.id !== entryId);

  container.querySelectorAll("[data-target-idx]").forEach(input => {
    input.addEventListener("change", (e) => {
      const idx = Number(input.dataset.targetIdx);
      const v = e.target.value === "" ? 0 : Number(e.target.value);

  container.querySelectorAll("#otherRevenueBody tr").forEach(tr => {
    const month = tr.dataset.otherMonth;
    tr.querySelectorAll("[data-other-field]").forEach(input => {
      const field = input.dataset.otherField;

}

function showApp(session) {
  document.getElementById("loginGate").style.display = "none";
  document.getElementById("appWrap").style.display = "";
  currentUserEmail = session.user.email;
  document.getElementById("userEmail").textContent = currentUserEmail;
  document.getElementById("resetBtn").style.display = isSuperAdmin(currentUserEmail) ? "" : "none";
  if (!appStarted) {
    appStarted = true;
    initCloud();
  }
}

async function handleAuthState(session) {
  if (!session) {
    showLoginGate(blockedMessage);
    return;
  }
  const email = session.user && session.user.email;
  if (!isAllowedEmail(email)) {
    blockedMessage = "此帳號（" + (email || "未知") + "）不在允許的名單內，僅限 beutii.com.tw 網域的帳號才能使用，請改用其他帳號登入。";
    await sb.auth.signOut();
    return;
  }
  blockedMessage = null;
  showApp(session);
}

document.getElementById("googleLoginBtn").onclick = async () => {
  blockedMessage = null;
  await sb.auth.signInWithOAuth({
    provider: "google",
    options: {
      queryParams: { hd: "beutii.com.tw", prompt: "select_account" },
      redirectTo: window.location.origin + window.location.pathname,
    },
  });
};

document.getElementById("logoutBtn").onclick = async () => {
  await sb.auth.signOut();
};

sb.auth.onAuthStateChange((_event, session) => {
  handleAuthState(session);
});

sb.auth.getSession().then(({ data }) => {
  handleAuthState(data.session);
});
</script>
</body>
</html>
